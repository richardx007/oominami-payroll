# Supabase の毎日バックアップ
#
# Supabase の無料プランには自動バックアップが無い（Pro以上のみ）。公式ドキュメントでも
# 「無料プランは db dump で自分でエクスポートし、オフサイト保管すること」が推奨されている。
# そこで GitHub Actions で毎日ダンプを取得し、**別のプライベートリポジトリ**へコミットする。
#
# 保管先を別リポジトリにしているのは、Supabase と Cloudflare のどちらが失われても
# バックアップが無事に残るようにするため（第三の場所に置く）。
# 世代管理は Git の履歴そのもの。「3日前の状態」は `git show HEAD~3:data.sql` で取り出せる。
#
# 必要な Secrets（このリポジトリの Settings > Secrets and variables > Actions）:
#   SUPABASE_DB_PASSWORD … SupabaseのDBパスワード（そのまま。URLエンコード不要）
#   BACKUP_REPO_TOKEN    … バックアップ先リポジトリへ push できる Personal Access Token
#
# 接続文字列は下の DB_HOST/DB_PORT/DB_USER から組み立てる。手で組み立てると
# ユーザー名の付け忘れ（Session pooler は `postgres.<project-ref>` が必須）や
# パスワードの記号のエンコード漏れで認証に失敗しやすいため、機械的に組み立てる。
# どうしても文字列を直接指定したい場合は Secrets に SUPABASE_DB_URL を入れれば
# そちらが使われる（SUPABASE_DB_PASSWORD が未設定のときのみ）。
name: Daily backup

on:
  schedule:
    # 毎日 JST 03:00（UTC 18:00）。GitHub のスケジュールは混雑時にずれることがある
    - cron: "0 18 * * *"
  workflow_dispatch: # 手動実行（動作確認用）

env:
  # バックアップ先リポジトリ。変更する場合はここだけ直す
  BACKUP_REPO: richardx007/oominami-payroll-backups
  # Supabase の Session pooler の接続先（秘密情報ではないのでここに置く）。
  # ⚠️ DB_USER は必ず `postgres.<project-ref>`。`postgres` だけだと認証に失敗する。
  DB_HOST: aws-0-ap-northeast-1.pooler.supabase.com
  DB_PORT: "5432"
  DB_USER: postgres.zvrwkmriosaldjqpxdwi

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: バックアップ先リポジトリを取得
        uses: actions/checkout@v5
        with:
          repository: ${{ env.BACKUP_REPO }}
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backup

      # Supabase CLI は使わない。CLI は pg_dump をコンテナ内で実行する際に接続URLを
      # 解析し直すため、Session pooler 用のユーザー名(postgres.<project-ref>)が
      # postgres に落ちて認証に失敗した(2026-07-28)。pg_dump を直接使えばこの解析が挟まらない。
      # サーバーが Postgres 17 系のため、クライアントも 17 を入れる(古いと版違いで拒否される)。
      - name: PostgreSQLクライアント(17)を用意
        run: |
          set -euo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # ランナーには 16 系が入っており、そのままだと /usr/bin/pg_dump が 16 を指して
          # 「aborting because of server version mismatch」で失敗する。17 を先に見せる。
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      # 接続文字列はここで組み立てる。手で組み立てるとユーザー名の付け忘れ
      # (Session pooler は postgres.<project-ref> が必須)やパスワードの記号の
      # エンコード漏れで失敗しやすいため、機械的に作る。
      - name: 接続文字列を組み立て
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DB_URL_OVERRIDE: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -n "${DB_PASSWORD:-}" ]; then
            # Secrets に貼るとき末尾に改行や空白が入ることがあるため取り除く。
            # 残っていると URL エンコードで %0A などになり、必ず認証に失敗する。
            DB_PASSWORD=$(printf %s "$DB_PASSWORD" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            export DB_PASSWORD
            # パスワードに記号（@ # / : ? など）が含まれていても壊れないよう URL エンコードする
            ENC=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["DB_PASSWORD"], safe=""))')
            URL="postgresql://${DB_USER}:${ENC}@${DB_HOST}:${DB_PORT}/postgres"
            # 切り分け用（パスワードそのものは出さない）
            echo "接続先: ${DB_USER}@${DB_HOST}:${DB_PORT} / パスワード長: ${#DB_PASSWORD}"
          elif [ -n "${DB_URL_OVERRIDE:-}" ]; then
            URL="$DB_URL_OVERRIDE"
          else
            echo "SUPABASE_DB_PASSWORD も SUPABASE_DB_URL も設定されていません" >&2
            exit 1
          fi
          # 組み立てた文字列がログに出ないようマスクする
          echo "::add-mask::$URL"
          echo "DB_URL=$URL" >> "$GITHUB_ENV"

      # 認証が通るかどうかを最初に確かめる。ここで失敗するなら資格情報の問題、
      # 通るのにダンプで失敗するならダンプ側の問題、と切り分けられる。
      - name: 接続テスト
        run: |
          set -euo pipefail
          # 空だと psql がローカルソケットに接続しに行き、紛らわしいエラーになるため先に弾く
          if [ -z "${DB_URL:-}" ]; then
            echo "DB_URL が空です（接続文字列の組み立てに失敗しています）" >&2
            exit 1
          fi
          echo "使用する pg_dump: $(command -v pg_dump) / $(pg_dump --version)"
          psql "$DB_URL" -Atc "select current_user, version()"

      - name: ダンプを取得
        run: |
          set -euo pipefail
          cd backup
          # スキーマ(テーブル・RLSポリシー・関数・トリガ・権限)。再構築の土台。
          # --no-owner: 復元先では所有者が変わるため、所有者指定は落とす。
          # 権限(GRANT)は落とさない。SECURITY DEFINER 関数の authenticated への
          # 実行権限など、無いと動かないものが含まれるため。
          pg_dump "$DB_URL" --schema-only --no-owner --schema=public -f schema.sql
          # 業務データ
          pg_dump "$DB_URL" --data-only --no-owner --schema=public -f data.sql
          # 認証ユーザー。これが無いとログインを復元できない
          pg_dump "$DB_URL" --data-only --no-owner \
            --table=auth.users --table=auth.identities -f auth_data.sql

      - name: 変更があればコミット
        run: |
          set -euo pipefail
          cd backup
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "内容に変更がないためコミットしません" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "backup: $(date -u +%Y-%m-%d)"
            git push
            echo "バックアップをコミットしました" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo ""
            echo "| ファイル | サイズ |"
            echo "|---|---|"
            for f in schema.sql data.sql auth_data.sql; do
              echo "| $f | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
