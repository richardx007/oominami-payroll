# Supabase の毎日バックアップ
#
# Supabase の無料プランには自動バックアップが無い（Pro以上のみ）。公式ドキュメントでも
# 「無料プランは db dump で自分でエクスポートし、オフサイト保管すること」が推奨されている。
# そこで GitHub Actions で毎日ダンプを取得し、**別のプライベートリポジトリ**へコミットする。
#
# 保管先を別リポジトリにしているのは、Supabase と Cloudflare のどちらが失われても
# バックアップが無事に残るようにするため（第三の場所に置く）。
# 世代管理は Git の履歴そのもの。「3日前の状態」は `git show HEAD~3:data.sql` で取り出せる。
#
# 必要な Secrets（このリポジトリの Settings > Secrets and variables > Actions）:
#   SUPABASE_DB_PASSWORD … SupabaseのDBパスワード（そのまま。URLエンコード不要）
#   BACKUP_REPO_TOKEN    … バックアップ先リポジトリへ push できる Personal Access Token
#   ── 業務管理(oominami-business)のレシートを Google ドライブへコピーする receipts ジョブ用 ──
#   SUPABASE_S3_ACCESS_KEY_ID / SUPABASE_S3_SECRET_ACCESS_KEY … Supabase Storage の S3 アクセスキー
#   GDRIVE_RCLONE_TOKEN  … rclone の Google ドライブ認証トークン(JSON。docs/disaster-recovery.md §2.3)
#
# 接続文字列は下の DB_HOST/DB_PORT/DB_USER から組み立てる。手で組み立てると
# ユーザー名の付け忘れ（Session pooler は `postgres.<project-ref>` が必須）や
# パスワードの記号のエンコード漏れで認証に失敗しやすいため、機械的に組み立てる。
# どうしても文字列を直接指定したい場合は Secrets に SUPABASE_DB_URL を入れれば
# そちらが使われる（SUPABASE_DB_PASSWORD が未設定のときのみ）。
name: Daily backup

on:
  schedule:
    # 毎日 JST 03:00（UTC 18:00）。GitHub のスケジュールは混雑時にずれることがある
    - cron: "0 18 * * *"
  workflow_dispatch: # 手動実行（動作確認用）

env:
  # バックアップ先リポジトリ。変更する場合はここだけ直す
  BACKUP_REPO: richardx007/oominami-payroll-backups
  # Supabase の Session pooler の接続先（秘密情報ではないのでここに置く）。
  # ⚠️ DB_USER は必ず `postgres.<project-ref>`。`postgres` だけだと認証に失敗する。
  DB_HOST: aws-0-ap-northeast-1.pooler.supabase.com
  DB_PORT: "5432"
  DB_USER: postgres.zvrwkmriosaldjqpxdwi

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: バックアップ先リポジトリを取得
        uses: actions/checkout@v5
        with:
          repository: ${{ env.BACKUP_REPO }}
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backup

      # Supabase CLI は使わない。CLI は pg_dump をコンテナ内で実行する際に接続URLを
      # 解析し直すため、Session pooler 用のユーザー名(postgres.<project-ref>)が
      # postgres に落ちて認証に失敗した(2026-07-28)。pg_dump を直接使えばこの解析が挟まらない。
      # サーバーが Postgres 17 系のため、クライアントも 17 を入れる(古いと版違いで拒否される)。
      - name: PostgreSQLクライアント(17)を用意
        run: |
          set -euo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # ランナーには 16 系が入っており、そのままだと /usr/bin/pg_dump が 16 を指して
          # 「aborting because of server version mismatch」で失敗する。17 を先に見せる。
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      # 接続文字列はここで組み立てる。手で組み立てるとユーザー名の付け忘れ
      # (Session pooler は postgres.<project-ref> が必須)やパスワードの記号の
      # エンコード漏れで失敗しやすいため、機械的に作る。
      - name: 接続文字列を組み立て
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DB_URL_OVERRIDE: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -n "${DB_PASSWORD:-}" ]; then
            # Secrets に貼るとき末尾に改行や空白が入ることがあるため取り除く。
            # 残っていると URL エンコードで %0A などになり、必ず認証に失敗する。
            DB_PASSWORD=$(printf %s "$DB_PASSWORD" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            export DB_PASSWORD
            # パスワードに記号（@ # / : ? など）が含まれていても壊れないよう URL エンコードする
            ENC=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["DB_PASSWORD"], safe=""))')
            URL="postgresql://${DB_USER}:${ENC}@${DB_HOST}:${DB_PORT}/postgres"
            # 切り分け用（パスワードそのものは出さない）
            echo "接続先: ${DB_USER}@${DB_HOST}:${DB_PORT} / パスワード長: ${#DB_PASSWORD}"
          elif [ -n "${DB_URL_OVERRIDE:-}" ]; then
            URL="$DB_URL_OVERRIDE"
          else
            echo "SUPABASE_DB_PASSWORD も SUPABASE_DB_URL も設定されていません" >&2
            exit 1
          fi
          # 組み立てた文字列がログに出ないようマスクする
          echo "::add-mask::$URL"
          echo "DB_URL=$URL" >> "$GITHUB_ENV"

      # 認証が通るかどうかを最初に確かめる。ここで失敗するなら資格情報の問題、
      # 通るのにダンプで失敗するならダンプ側の問題、と切り分けられる。
      - name: 接続テスト
        run: |
          set -euo pipefail
          # 空だと psql がローカルソケットに接続しに行き、紛らわしいエラーになるため先に弾く
          if [ -z "${DB_URL:-}" ]; then
            echo "DB_URL が空です（接続文字列の組み立てに失敗しています）" >&2
            exit 1
          fi
          echo "使用する pg_dump: $(command -v pg_dump) / $(pg_dump --version)"
          psql "$DB_URL" -Atc "select current_user, version()"

      - name: ダンプを取得
        run: |
          set -euo pipefail
          cd backup
          # スキーマ(テーブル・RLSポリシー・関数・トリガ・権限)。再構築の土台。
          # --no-owner: 復元先では所有者が変わるため、所有者指定は落とす。
          # 権限(GRANT)は落とさない。SECURITY DEFINER 関数の authenticated への
          # 実行権限など、無いと動かないものが含まれるため。
          pg_dump "$DB_URL" --schema-only --no-owner --schema=public -f schema.sql
          # 業務データ
          pg_dump "$DB_URL" --data-only --no-owner --schema=public -f data.sql
          # 認証ユーザー。これが無いとログインを復元できない
          pg_dump "$DB_URL" --data-only --no-owner \
            --table=auth.users --table=auth.identities -f auth_data.sql

      - name: 変更があればコミット
        run: |
          set -euo pipefail
          cd backup
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            RESULT="変更なし"
          else
            git commit -m "backup: $(date -u +%Y-%m-%d)"
            git push
            RESULT="コミット済み"
          fi
          SIZES=$(du -h schema.sql data.sql auth_data.sql | awk '{printf "%s %s / ", $2, $1}' | sed 's| / $||')
          echo "BACKUP_RESULT=$RESULT" >> "$GITHUB_ENV"
          echo "BACKUP_SIZES=$SIZES" >> "$GITHUB_ENV"
          {
            echo "バックアップ: $RESULT"
            echo ""
            echo "$SIZES"
          } >> "$GITHUB_STEP_SUMMARY"

      # バックアップ用トークンの有効期限を確認する。期限切れに気づかず
      # バックアップが止まるのを防ぐため、残り30日を切ったら警告する。
      # 有効期限は GitHub API のレスポンスヘッダーから取得できる。
      - name: トークンの有効期限を確認
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          set -uo pipefail
          EXP=$(curl -sI -H "Authorization: Bearer $TOKEN" https://api.github.com/user \
            | tr -d '\r' \
            | awk -F': ' 'tolower($1)=="github-authentication-token-expiration"{print $2}')
          if [ -z "$EXP" ]; then
            echo "有効期限を取得できませんでした（無期限のトークンの可能性）"
            exit 0
          fi
          DAYS=$(( ( $(date -d "$EXP" +%s) - $(date +%s) ) / 86400 ))
          echo "トークンの有効期限: $EXP （残り ${DAYS} 日）"
          echo "TOKEN_DAYS_LEFT=$DAYS" >> "$GITHUB_ENV"
          if [ "$DAYS" -le 30 ]; then
            echo "::warning::バックアップ用トークンの期限まで残り ${DAYS} 日です。再発行してください（docs/disaster-recovery.md 参照）"
            echo "⚠️ バックアップ用トークンの期限まで残り **${DAYS} 日**。再発行してください。" >> "$GITHUB_STEP_SUMMARY"
          fi

      # アプリの操作ログにも残す。GitHub を見に行かなくても、管理画面の
      # 「操作ログ」でバックアップが動いているか確認できるようにするため。
      - name: 操作ログに記録
        continue-on-error: true
        run: |
          set -uo pipefail
          DETAIL="${BACKUP_RESULT:-不明} / ${BACKUP_SIZES:-}"
          ACTION="バックアップ"
          if [ -n "${TOKEN_DAYS_LEFT:-}" ] && [ "${TOKEN_DAYS_LEFT}" -le 30 ]; then
            ACTION="バックアップ警告"
            DETAIL="$DETAIL / ⚠️トークンの期限まで残り${TOKEN_DAYS_LEFT}日。再発行が必要です"
          fi
          # ⚠️ psqlの :'var' 変数展開は -c (コマンドライン引数) では行われず、
          # 標準入力経由でSQLを渡した場合のみ機能する(実機で確認済み。
          # -c のままだと "syntax error at or near ':'" で毎回失敗していた。2026-07-29発覚)。
          SQL_TEXT="insert into public.activity_logs (actor_name, action, detail) values ('自動バックアップ', :'action', :'detail');"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -v action="$ACTION" -v detail="$DETAIL" <<< "$SQL_TEXT"

      # 失敗したときも操作ログに残す（気づかず放置されるのを防ぐ）。
      # 元の失敗を隠さないよう continue-on-error にしている。
      - name: 失敗を操作ログに記録
        if: failure()
        continue-on-error: true
        run: |
          set -uo pipefail
          [ -n "${DB_URL:-}" ] || exit 0
          SQL_TEXT="insert into public.activity_logs (actor_name, action, detail) values ('自動バックアップ', 'エラー', :'detail');"
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -v detail="自動バックアップに失敗しました。GitHub Actions のログを確認してください: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" <<< "$SQL_TEXT"

  # ------------------------------------------------------------------
  # 業務管理(oominami-business)のレシート画像を Google ドライブへコピーする。
  # pg_dump では Storage のファイルは取れないため、expense-receipts バケットの中身を
  # rclone で Supabase Storage(S3 互換)→ Google ドライブへコピーする。
  # ・rclone copy + --ignore-existing: 新しいファイルだけを足す。**コピー元で消えてもコピー先は消さない**
  #   (sync は使わない)。レシートは上書き・削除できない設計なので、既にあるファイルは比べる必要がない。
  # ・ドライブの権限は drive.file(rclone が自分で作ったファイル・フォルダだけ見える)。
  #   コピー先フォルダは rclone が初回に作る。そのアカウントの他のファイルには触れない。
  # ・DB のバックアップ(dump)とは別ジョブ。ドライブ側の不具合で DB のバックアップを止めないため。
  # ------------------------------------------------------------------
  receipts:
    runs-on: ubuntu-latest
    env:
      # Supabase Storage の S3 互換エンドポイント(秘密情報ではない)
      S3_ENDPOINT: https://zvrwkmriosaldjqpxdwi.storage.supabase.co/storage/v1/s3
      S3_REGION: ap-northeast-1
      SRC: supa:expense-receipts
      DEST: gdrive:oominami-backups/expense-receipts
    steps:
      - name: rclone を用意
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          rclone version | head -1

      # 設定ファイルは作らず、環境変数(RCLONE_CONFIG_<名前>_<項目>)で rclone のリモートを定義する
      - name: レシートを Google ドライブへコピー
        env:
          RCLONE_CONFIG_SUPA_TYPE: s3
          RCLONE_CONFIG_SUPA_PROVIDER: Other
          RCLONE_CONFIG_SUPA_ENDPOINT: ${{ env.S3_ENDPOINT }}
          RCLONE_CONFIG_SUPA_REGION: ${{ env.S3_REGION }}
          RCLONE_CONFIG_SUPA_FORCE_PATH_STYLE: "true"
          RCLONE_CONFIG_SUPA_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_SUPA_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_RCLONE_TOKEN }}
        run: |
          set -euo pipefail
          for v in RCLONE_CONFIG_SUPA_ACCESS_KEY_ID RCLONE_CONFIG_SUPA_SECRET_ACCESS_KEY RCLONE_CONFIG_GDRIVE_TOKEN; do
            if [ -z "${!v:-}" ]; then echo "Secrets が未設定です: $v" >&2; exit 1; fi
          done
          SRC_COUNT=$(rclone size "$SRC" --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["count"])')
          rclone copy "$SRC" "$DEST" --ignore-existing --stats-one-line --stats 0 -v 2>&1 | tail -n 20
          SIZE_JSON=$(rclone size "$DEST" --json)
          COUNT=$(printf %s "$SIZE_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["count"])')
          BYTES=$(printf %s "$SIZE_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["bytes"])')
          MB=$(python3 -c "print(f'{$BYTES/1024/1024:.1f}')")
          # コピー元にあるのにコピー先に無いファイルが残っていたら失敗にする(取りこぼしに気づくため)
          if [ "$COUNT" -lt "$SRC_COUNT" ]; then
            echo "コピー先の件数($COUNT)がコピー元($SRC_COUNT)より少ない" >&2
            exit 1
          fi
          RESULT="レシート ${COUNT}件 / ${MB}MB(Supabase 側 ${SRC_COUNT}件)"
          echo "RECEIPTS_RESULT=$RESULT" >> "$GITHUB_ENV"
          echo "レシートのバックアップ: $RESULT" >> "$GITHUB_STEP_SUMMARY"

      # 以下、操作ログへの記録(dump ジョブと同じ組み立て。ジョブ間で環境変数は引き継げないため再度作る)
      - name: 操作ログ用の接続文字列を組み立て
        if: always()
        continue-on-error: true
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${DB_PASSWORD:-}" ] || exit 0
          DB_PASSWORD=$(printf %s "$DB_PASSWORD" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          export DB_PASSWORD
          ENC=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["DB_PASSWORD"], safe=""))')
          URL="postgresql://${DB_USER}:${ENC}@${DB_HOST}:${DB_PORT}/postgres"
          echo "::add-mask::$URL"
          echo "DB_URL=$URL" >> "$GITHUB_ENV"

      # 保存期間(経費管理の設定画面。既定 3 年)を過ぎたレシート画像を Supabase Storage から消す(2026-10-04 経費管理のオーナー依頼)。
      # ・上のコピーが成功したあとにだけ動き、**ドライブにあることを確かめたファイルだけ**を消す(ドライブからは消さない)
      # ・対象の選び方と記録は経費管理の DB 関数(oominami-business の supabase/migrations/20261004120000_expense_receipt_retention.sql):
      #   expense_receipts_purge_targets() … 購入日が期限より前で、まだ消していないレシートのパス
      #   expense_receipts_mark_purged(paths) … 消したファイルを expense_receipts.purged_at に記録(画面に「期限切れ削除済み」)
      # ・紙の原本は 7 年保管する運用(経費管理のオーナー確認済み)
      - name: 保存期間を過ぎたレシートを Supabase から削除
        if: success()
        env:
          RCLONE_CONFIG_SUPA_TYPE: s3
          RCLONE_CONFIG_SUPA_PROVIDER: Other
          RCLONE_CONFIG_SUPA_ENDPOINT: ${{ env.S3_ENDPOINT }}
          RCLONE_CONFIG_SUPA_REGION: ${{ env.S3_REGION }}
          RCLONE_CONFIG_SUPA_FORCE_PATH_STYLE: "true"
          RCLONE_CONFIG_SUPA_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_SUPA_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_RCLONE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then
            echo "DB に接続できないため、期限切れのレシートの削除はしない" >&2
            exit 1
          fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select storage_path from public.expense_receipts_purge_targets()" > targets.txt
          # パスは {経費ID}/{レシートID}.jpg|png|pdf だけ。それ以外が混じっていたら何も消さずに止める
          if grep -vqE '^[0-9a-f-]{36}/[0-9a-f-]{36}\.(jpg|png|pdf)$' targets.txt; then
            echo "想定外のパスが対象に含まれている" >&2
            exit 1
          fi
          TARGETS=$(grep -c . targets.txt || true)
          if [ "$TARGETS" -eq 0 ]; then
            echo "PURGE_RESULT=期限切れの削除 0件" >> "$GITHUB_ENV"
            exit 0
          fi
          # ドライブにあるものだけを消す
          rclone lsf -R --files-only "$DEST" > drive.txt
          grep -Fxf drive.txt targets.txt > deletable.txt || true
          DELETABLE=$(grep -c . deletable.txt || true)
          if [ "$DELETABLE" -gt 0 ]; then
            rclone delete "$SRC" --files-from deletable.txt -v 2>&1 | tail -n 20
          fi
          # Supabase から本当に消えた(または元から無い)ものだけを記録する
          rclone lsf -R --files-only "$SRC" > src_after.txt
          grep -vFxf src_after.txt deletable.txt > purged.txt || true
          SQL_TEXT="select public.expense_receipts_mark_purged(string_to_array(:'paths', E'\n'));"
          MARKED=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -At -v paths="$(cat purged.txt)" <<< "$SQL_TEXT")
          RESULT="期限切れの削除 ${MARKED}件(対象 ${TARGETS}件"
          if [ "$DELETABLE" -lt "$TARGETS" ]; then RESULT="${RESULT}・ドライブに無いため残した $((TARGETS - DELETABLE))件"; fi
          RESULT="${RESULT})"
          echo "PURGE_RESULT=$RESULT" >> "$GITHUB_ENV"
          echo "レシート: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          # ドライブに無いものがあったら気づけるよう失敗にする(消したものの記録は済んでいる)
          if [ "$DELETABLE" -lt "$TARGETS" ]; then
            echo "ドライブに無いため消さなかったレシートがある" >&2
            exit 1
          fi

      - name: 操作ログに記録
        if: success()
        continue-on-error: true
        run: |
          set -uo pipefail
          [ -n "${DB_URL:-}" ] || exit 0
          SQL_TEXT="insert into public.activity_logs (actor_name, action, detail) values ('自動バックアップ', 'バックアップ', :'detail');"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -v detail="${RECEIPTS_RESULT:-} / ${PURGE_RESULT:-期限切れの削除なし}" <<< "$SQL_TEXT"

      - name: 失敗を操作ログに記録
        if: failure()
        continue-on-error: true
        run: |
          set -uo pipefail
          [ -n "${DB_URL:-}" ] || exit 0
          SQL_TEXT="insert into public.activity_logs (actor_name, action, detail) values ('自動バックアップ', 'エラー', :'detail');"
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -v detail="レシートの Google ドライブへのバックアップに失敗しました。GitHub Actions のログを確認してください: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" <<< "$SQL_TEXT"
